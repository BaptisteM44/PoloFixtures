<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- Left player body -->
  <rect x="2" y="4" width="2" height="1" fill="currentColor"/>
  <rect x="3" y="5" width="1" height="3" fill="currentColor"/>
  <rect x="2" y="8" width="1" height="2" fill="currentColor"/>
  <rect x="4" y="8" width="1" height="2" fill="currentColor"/>
  <!-- Left player head -->
  <rect x="2" y="2" width="2" height="2" fill="currentColor"/>
  <!-- Left mallet arm + stick -->
  <rect x="4" y="5" width="1" height="1" fill="currentColor"/>
  <rect x="5" y="6" width="1" height="1" fill="currentColor"/>
  <rect x="6" y="7" width="1" height="1" fill="currentColor"/>
  <rect x="7" y="7" width="1" height="1" fill="currentColor"/>
  <!-- Left mallet head -->
  <rect x="7" y="8" width="1" height="2" fill="currentColor"/>

  <!-- Right player body -->
  <rect x="12" y="4" width="2" height="1" fill="currentColor"/>
  <rect x="12" y="5" width="1" height="3" fill="currentColor"/>
  <rect x="11" y="8" width="1" height="2" fill="currentColor"/>
  <rect x="13" y="8" width="1" height="2" fill="currentColor"/>
  <!-- Right player head -->
  <rect x="12" y="2" width="2" height="2" fill="currentColor"/>
  <!-- Right mallet arm + stick -->
  <rect x="11" y="5" width="1" height="1" fill="currentColor"/>
  <rect x="10" y="6" width="1" height="1" fill="currentColor"/>
  <rect x="9" y="7" width="1" height="1" fill="currentColor"/>
  <rect x="8" y="7" width="1" height="1" fill="currentColor"/>
  <!-- Right mallet head -->
  <rect x="8" y="8" width="1" height="2" fill="currentColor"/>
</svg>